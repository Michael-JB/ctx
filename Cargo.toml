[package]
name = "ctx-tui"
version = "1.0.4"
edition = "2024"
description = "Manage repo-scoped work contexts: fresh checkouts wrapped in terminal multiplexer sessions"
license = "MIT"
repository = "https://github.com/Michael-JB/ctx"
readme = "README.md"
keywords = ["git", "tmux", "zellij", "context", "tui"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.90"
exclude = ["docs/", ".github/", "tests/"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
rand = "0.10.2"
ratatui = "0.30.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
shlex = "2.0.1"
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
tui-input = "0.15.4"
unicode-width = "0.2.2"
wait-timeout = "0.2.1"

[[bin]]
name = "ctx"
path = "src/main.rs"
