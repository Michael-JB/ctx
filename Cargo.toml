[package]
name = "ctx-tui"
version = "1.0.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
rand = "0.10.2"
ratatui = "0.30.2"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = "1.1.4"
tui-input = "0.15.4"
wait-timeout = "0.2.1"

[[bin]]
name = "ctx"
path = "src/main.rs"
