[project]
name = "ctx"
version = "0.1.0"
description = "Manage repo-scoped work contexts: fresh checkouts plus a tmux session per context"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
]

[project.scripts]
ctx = "ctx.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.9"]
build-backend = "uv_build"
