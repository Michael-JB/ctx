[project]
name = "ctx-tui"
version = "0.3.1"
description = "Manage repo-scoped work contexts: fresh checkouts wrapped in terminal multiplexer sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "textual>=8.2.8",
]

[project.scripts]
ctx = "ctx.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ctx"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.3",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # pathlib
    "RUF",
]

[tool.mypy]
strict = true
