# One-off manual publisher for the final PyPI release on this frozen
# branch; the filename must stay release.yml to match PyPI's trusted
# publisher configuration.
name: release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Authenticates to PyPI via trusted publishing; no token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv publish --trusted-publishing always
