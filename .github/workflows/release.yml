name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Configured by release-please-config.json; the rust release type
      # keeps Cargo.toml and Cargo.lock in step.
      - uses: googleapis/release-please-action@v4
        id: release

  # A release always carries a version new to crates.io, so a failed publish
  # or upload is recovered with "Re-run failed jobs" on this run.
  crates-io:
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created
    strategy:
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Upload to the GitHub release
        run: |
          tar -czf "ctx-${{ matrix.target }}.tar.gz" \
              -C target/${{ matrix.target }}/release ctx
          gh release upload --clobber \
              '${{ needs.release-please.outputs.tag_name }}' \
              "ctx-${{ matrix.target }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
